<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DieCast Hub | Hot Wheels & Die-Cast Car Collectibles Store</title>
  <meta name="description" content="Buy authentic Hot Wheels, JDM, Supercars, Muscle cars, Track Racers & limited edition die-cast collectible cars online at DieCast Hub." />
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#fff1f2',
              100: '#ffe4e6',
              500: '#f43f5e',
              600: '#e11d48',
              700: '#be123c',
              800: '#9f1239',
              900: '#881337',
              accent: '#f59e0b'
            }
          }
        }
      }
    }
  </script>
  
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Supabase JS Client CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- Canvas Confetti CDN -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'Outfit', sans-serif; }
    .glass { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(14px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .glass-light { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(0, 0, 0, 0.05); }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 antialiased selection:bg-rose-500 selection:text-white min-h-screen flex flex-col">

  <!-- APP CONTAINER -->
  <div id="app" class="flex-1 flex flex-col"></div>

  <!-- MAIN SCRIPT MODULE -->
  <script type="module">
    import { store } from './app.js';

    // 1. Toast Alert Component
    function Toast() {
      if (!store.toastMessage) return '';
      const isError = store.toastMessage.type === 'error';
      return `
        <div class="fixed bottom-6 right-6 z-50 flex items-center gap-3 px-5 py-3.5 rounded-2xl shadow-2xl transition-all duration-300 ${isError ? 'bg-rose-600 text-white' : 'bg-emerald-600 text-white'} font-bold animate-bounce shadow-rose-950/50">
          <i data-lucide="${isError ? 'alert-triangle' : 'check-circle'}" class="w-5 h-5"></i>
          <span>${store.toastMessage.text}</span>
        </div>
      `;
    }

    // 2. Navigation Header
    function Header() {
      const cartCount = store.cart.reduce((sum, item) => sum + item.quantity, 0);
      const wishlistCount = store.wishlist.length;
      const isAdmin = store.user?.role === 'admin';

      return `
        <header class="sticky top-0 z-40 glass border-b border-slate-800/80">
          <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-20 gap-4">
              
              <!-- Brand Logo -->
              <div onclick="store.currentView = 'home'; store.save();" class="flex items-center gap-3 cursor-pointer group">
                <div class="w-11 h-11 rounded-2xl bg-gradient-to-tr from-rose-600 to-amber-500 flex items-center justify-center shadow-lg shadow-rose-600/30 group-hover:scale-105 transition-transform">
                  <i data-lucide="flame" class="w-6 h-6 text-white fill-white"></i>
                </div>
                <div>
                  <span class="text-2xl font-black tracking-wider bg-gradient-to-r from-white via-slate-100 to-rose-400 bg-clip-text text-transparent">
                    DIECAST<span class="text-rose-500">HUB</span>
                  </span>
                  <p class="text-[10px] tracking-widest text-slate-400 uppercase font-bold">50+ Collectibles & Mainlines</p>
                </div>
              </div>

              <!-- Search Bar -->
              <div class="hidden md:flex flex-1 max-w-md relative">
                <input 
                  type="text" 
                  placeholder="Search 50+ models: Skyline, Supra, Batmobile, DeLorean..." 
                  value="${store.searchQuery}"
                  oninput="store.searchQuery = this.value; store.currentView = 'shop'; renderApp();"
                  class="w-full pl-11 pr-4 py-2.5 rounded-xl bg-slate-900/90 border border-slate-800 focus:border-rose-500 focus:ring-1 focus:ring-rose-500 text-xs text-slate-100 placeholder-slate-500 outline-none transition-all shadow-inner"
                />
                <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-4 top-3.5"></i>
              </div>

              <!-- Nav Actions -->
              <div class="flex items-center gap-2 sm:gap-4">
                <button onclick="store.activeCategoryFilter = 'all'; store.currentView = 'shop'; store.save();" class="flex items-center gap-1.5 text-xs font-bold text-slate-300 hover:text-rose-400 px-3 py-2 rounded-xl transition-colors">
                  <i data-lucide="compass" class="w-4 h-4 text-rose-500"></i> Explore 50+ Cars
                </button>

                <button onclick="store.currentView = 'wishlist'; store.save();" class="relative p-2.5 rounded-xl text-slate-300 hover:bg-slate-800 transition-colors">
                  <i data-lucide="heart" class="w-5 h-5 ${wishlistCount > 0 ? 'text-rose-500 fill-rose-500' : ''}"></i>
                  ${wishlistCount > 0 ? `<span class="absolute -top-1 -right-1 w-5 h-5 rounded-full bg-rose-600 text-white text-[11px] font-extrabold flex items-center justify-center">${wishlistCount}</span>` : ''}
                </button>

                <button onclick="store.currentView = 'cart'; store.save();" class="relative p-2.5 rounded-xl text-slate-300 hover:bg-slate-800 transition-colors">
                  <i data-lucide="shopping-cart" class="w-5 h-5"></i>
                  ${cartCount > 0 ? `<span class="absolute -top-1 -right-1 w-5 h-5 rounded-full bg-amber-500 text-slate-950 text-[11px] font-black flex items-center justify-center">${cartCount}</span>` : ''}
                </button>

                <!-- Profile / Admin Dropdown -->
                <div class="flex items-center gap-2 border-l border-slate-800 pl-3 sm:pl-4">
                  ${isAdmin ? `
                    <button onclick="store.currentView = 'admin'; store.save();" class="px-3 py-1.5 rounded-xl bg-amber-500/10 text-amber-400 border border-amber-500/20 text-xs font-bold hover:bg-amber-500/20 transition-all flex items-center gap-1.5">
                      <i data-lucide="shield-alert" class="w-3.5 h-3.5"></i> Admin
                    </button>
                  ` : ''}

                  <button onclick="store.currentView = '${store.user ? 'profile' : 'login'}'; store.save();" class="flex items-center gap-2 p-1.5 rounded-xl hover:bg-slate-800 transition-colors">
                    <img src="${store.user?.avatar_url || 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&q=80&w=100'}" class="w-8 h-8 rounded-xl object-cover ring-2 ring-rose-500/40" />
                    <span class="hidden lg:inline text-xs font-bold text-slate-200">${store.user ? store.user.full_name.split(' ')[0] : 'Sign In'}</span>
                  </button>
                </div>

              </div>

            </div>
          </div>
        </header>
      `;
    }

    // 3. Product Card Component
    function ProductCard(product) {
      const isWishlisted = store.wishlist.includes(product.id);
      const isOutOfStock = product.stock_quantity <= 0;

      return `
        <div class="group relative rounded-2xl bg-slate-900/60 border border-slate-800 hover:border-rose-500/50 overflow-hidden flex flex-col transition-all duration-300 hover:shadow-2xl hover:shadow-rose-950/20 hover:-translate-y-1">
          
          <!-- Image Header & Badges -->
          <div class="relative aspect-[4/3] bg-slate-950 overflow-hidden cursor-pointer" onclick="store.currentProductId = '${product.id}'; store.currentView = 'product-details'; store.save();">
            <img 
              src="${product.image_url}" 
              alt="${product.name}" 
              class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500"
              loading="lazy"
            />
            <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/20 to-transparent opacity-80"></div>
            
            <!-- Badges -->
            <div class="absolute top-3 left-3 flex flex-col gap-1.5">
              ${product.discount_percentage > 0 ? `<span class="px-2.5 py-1 rounded-lg bg-rose-600 text-white text-[10px] font-black uppercase tracking-wider shadow-md">${product.discount_percentage}% OFF</span>` : ''}
              ${product.is_bestseller ? `<span class="px-2.5 py-1 rounded-lg bg-amber-500 text-slate-950 text-[10px] font-black uppercase tracking-wider shadow-md">HOT ITEM</span>` : ''}
              ${product.is_new ? `<span class="px-2.5 py-1 rounded-lg bg-emerald-500 text-slate-950 text-[10px] font-black uppercase tracking-wider shadow-md">NEW</span>` : ''}
            </div>

            <!-- Wishlist Button -->
            <button 
              onclick="event.stopPropagation(); store.toggleWishlist('${product.id}');"
              class="absolute top-3 right-3 p-2 rounded-xl glass hover:bg-slate-800 transition-colors z-10"
            >
              <i data-lucide="heart" class="w-4 h-4 ${isWishlisted ? 'text-rose-500 fill-rose-500' : 'text-slate-300'}"></i>
            </button>
          </div>

          <!-- Product Details -->
          <div class="p-4 flex-1 flex flex-col justify-between">
            <div>
              <div class="flex items-center justify-between text-[11px] text-slate-400 mb-1">
                <span class="font-bold text-rose-400 line-clamp-1">${product.series || 'Mainline'}</span>
                <span class="font-semibold">${product.scale || '1:64'}</span>
              </div>

              <h3 
                onclick="store.currentProductId = '${product.id}'; store.currentView = 'product-details'; store.save();"
                class="font-bold text-slate-100 text-sm line-clamp-1 cursor-pointer hover:text-rose-400 transition-colors"
                title="${product.name}"
              >
                ${product.name}
              </h3>

              <!-- Rating -->
              <div class="flex items-center gap-1.5 my-2 text-xs">
                <div class="flex text-amber-400">
                  <i data-lucide="star" class="w-3.5 h-3.5 fill-amber-400"></i>
                </div>
                <span class="font-extrabold text-slate-200">${product.rating || '4.8'}</span>
                <span class="text-[11px] text-slate-500">(${product.reviews_count || 12})</span>
              </div>
            </div>

            <!-- Pricing & Action -->
            <div class="mt-3 pt-3 border-t border-slate-800/80 flex items-center justify-between gap-2">
              <div>
                <div class="flex items-baseline gap-2">
                  <span class="text-base font-black text-white">₹${product.price}</span>
                  ${product.original_price ? `<span class="text-[11px] text-slate-500 line-through">₹${product.original_price}</span>` : ''}
                </div>
                <p class="text-[10px] ${isOutOfStock ? 'text-rose-500 font-bold' : 'text-emerald-400 font-semibold'}">
                  ${isOutOfStock ? 'Out of Stock' : `In Stock (${product.stock_quantity})`}
                </p>
              </div>

              <button 
                onclick="store.addToCart('${product.id}');"
                ${isOutOfStock ? 'disabled' : ''}
                class="px-3 py-1.5 rounded-xl bg-gradient-to-r from-rose-600 to-rose-700 hover:from-rose-500 hover:to-rose-600 disabled:opacity-50 disabled:cursor-not-allowed text-white text-xs font-bold flex items-center gap-1.5 shadow-lg shadow-rose-950/30 transition-all active:scale-95"
              >
                <i data-lucide="shopping-cart" class="w-3.5 h-3.5"></i> Add
              </button>
            </div>

          </div>

        </div>
      `;
    }

    // 4. Hero Section Component
    function Hero() {
      return `
        <section class="relative overflow-hidden py-12 md:py-20 bg-gradient-to-b from-slate-950 via-slate-900 to-slate-950 border-b border-slate-800/60">
          <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-rose-900/20 via-transparent to-transparent"></div>
          
          <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10">
            <div class="grid lg:grid-cols-12 gap-8 items-center">
              
              <div class="lg:col-span-7 space-y-6 text-center lg:text-left">
                <div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-rose-500/10 border border-rose-500/20 text-rose-400 text-xs font-bold uppercase tracking-wider">
                  <i data-lucide="zap" class="w-3.5 h-3.5"></i> Premier 50+ Die-Cast Collectors Store
                </div>
                
                <h1 class="text-4xl sm:text-6xl font-black tracking-tight text-white leading-none">
                  UNLEASH YOUR <br class="hidden sm:inline" />
                  <span class="bg-gradient-to-r from-rose-500 via-amber-400 to-rose-400 bg-clip-text text-transparent">COLLECTOR PASSION</span>
                </h1>

                <p class="text-slate-400 text-sm sm:text-base max-w-xl mx-auto lg:mx-0 leading-relaxed">
                  Explore over 50 authentic 1:64 scale die-cast cars: Japanese Tuner JDM icons, Supercars, Le Mans GT3 Racers, 70s Muscle V8s, Baja 4x4s, and rare Super Treasure Hunts.
                </p>

                <div class="flex flex-wrap items-center justify-center lg:justify-start gap-4 pt-2">
                  <button onclick="store.activeCategoryFilter = 'all'; store.currentView = 'shop'; store.save();" class="px-7 py-3.5 rounded-2xl bg-gradient-to-r from-rose-600 to-rose-700 hover:from-rose-500 hover:to-rose-600 text-white font-extrabold text-xs uppercase tracking-wider shadow-xl shadow-rose-900/40 flex items-center gap-2 transition-all hover:scale-105">
                    Explore All 50+ Cars <i data-lucide="arrow-right" class="w-4 h-4"></i>
                  </button>

                  <button onclick="store.activeCategoryFilter = 'limited-edition'; store.currentView = 'shop'; store.save();" class="px-7 py-3.5 rounded-2xl bg-slate-900 border border-slate-800 hover:border-amber-500/40 text-amber-400 font-extrabold text-xs uppercase tracking-wider flex items-center gap-2 transition-all hover:bg-slate-800">
                    <i data-lucide="award" class="w-4 h-4"></i> Rare Treasure Hunts
                  </button>
                </div>
              </div>

              <!-- Hero Spotlight Display -->
              <div class="lg:col-span-5 relative">
                <div class="relative rounded-3xl p-2 bg-gradient-to-b from-rose-500/30 via-slate-800/40 to-slate-900/60 border border-rose-500/30 shadow-2xl shadow-rose-950/50">
                  <img 
                    src="https://images.unsplash.com/photo-1617814076367-b759c7d7e738?auto=format&fit=crop&q=80&w=800" 
                    alt="Featured Nissan Skyline R34" 
                    class="w-full h-[320px] sm:h-[380px] object-cover rounded-2xl"
                  />
                  <div class="absolute bottom-6 left-6 right-6 p-4 rounded-2xl glass border border-slate-700/80 flex items-center justify-between">
                    <div>
                      <span class="text-[10px] font-black text-rose-400 uppercase tracking-widest">COLLECTOR SPOTLIGHT</span>
                      <h4 class="font-bold text-white text-base">Nissan Skyline GT-R (R34)</h4>
                      <p class="text-xs text-slate-400">Factory Fresh Series • Bayside Blue</p>
                    </div>
                    <button onclick="store.currentProductId = 'a1111111-1111-1111-1111-111111111111'; store.currentView = 'product-details'; store.save();" class="p-3 rounded-xl bg-rose-600 text-white font-bold hover:bg-rose-500 transition-colors">
                      <i data-lucide="eye" class="w-4 h-4"></i>
                    </button>
                  </div>
                </div>
              </div>

            </div>
          </div>
        </section>
      `;
    }

    // 5. Views Implementation

    // HOME VIEW (Filled Grid Sections)
    function HomeView() {
      // Pull 8 featured cars to create two full balanced 4-card rows (no awkward gaps)
      const featured = store.products.filter(p => p.is_featured).slice(0, 8);
      // Pull 8 fresh drops for a full 2-row grid
      const newArrivals = store.products.filter(p => p.is_new).slice(0, 8);
      // Best sellers
      const bestSellers = store.products.filter(p => p.is_bestseller).slice(0, 8);

      return `
        <div>
          ${Hero()}

          <!-- 8 POPULAR COLLECTIONS SECTION -->
          <section class="py-16 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between mb-8">
              <div>
                <h2 class="text-2xl sm:text-3xl font-extrabold text-white">Collector Categories</h2>
                <p class="text-xs text-slate-400">Browse our 8 curated series and motorsport disciplines</p>
              </div>
              <button onclick="store.activeCategoryFilter = 'all'; store.currentView = 'shop'; store.save();" class="text-xs font-bold text-rose-400 hover:text-rose-300 flex items-center gap-1 uppercase tracking-wider">
                Explore All (${store.products.length} Cars) <i data-lucide="chevron-right" class="w-4 h-4"></i>
              </button>
            </div>

            <div class="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-8 gap-3 sm:gap-4">
              ${store.categories.map(cat => `
                <div 
                  onclick="store.activeCategoryFilter = '${cat.slug}'; store.currentView = 'shop'; store.save();"
                  class="group relative rounded-2xl overflow-hidden aspect-[4/5] cursor-pointer border border-slate-800 hover:border-rose-500/50 transition-all duration-300 shadow-lg"
                >
                  <img src="${cat.image_url}" alt="${cat.name}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500" />
                  <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/50 to-transparent"></div>
                  <div class="absolute bottom-3 left-3 right-3 text-center sm:text-left">
                    <h3 class="font-extrabold text-white text-xs sm:text-sm group-hover:text-rose-400 transition-colors leading-tight">${cat.name}</h3>
                  </div>
                </div>
              `).join('')}
            </div>
          </section>

          <!-- FEATURED DIE-CASTS (Balanced 8 items, 2 full rows) -->
          <section class="py-12 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between mb-8">
              <div>
                <h2 class="text-2xl font-extrabold text-white flex items-center gap-2">
                  <i data-lucide="sparkles" class="w-6 h-6 text-amber-400"></i> Featured Die-Casts
                </h2>
                <p class="text-xs text-slate-400">Handpicked premium models for true enthusiasts (Showing 8 spotlight models)</p>
              </div>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
              ${featured.map(ProductCard).join('')}
            </div>
          </section>

          <!-- NEW ARRIVALS DROPS (Balanced 8 items) -->
          <section class="py-14 bg-slate-900/40 border-y border-slate-800/60">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div class="flex items-center justify-between mb-8">
                <div>
                  <h2 class="text-2xl font-extrabold text-white flex items-center gap-2">
                    <i data-lucide="flame" class="w-6 h-6 text-rose-500"></i> Fresh Mainline Drops
                  </h2>
                  <p class="text-xs text-slate-400">Just arrived in our 50+ collector inventory</p>
                </div>
                <button onclick="store.activeCategoryFilter = 'all'; store.currentView = 'shop'; store.save();" class="text-xs font-bold text-rose-400 hover:text-rose-300">
                  View Full Catalog →
                </button>
              </div>
              <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                ${newArrivals.map(ProductCard).join('')}
              </div>
            </div>
          </section>

          <!-- BEST SELLERS -->
          <section class="py-14 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between mb-8">
              <div>
                <h2 class="text-2xl font-extrabold text-white flex items-center gap-2">
                  <i data-lucide="award" class="w-6 h-6 text-amber-400"></i> Collector Top Picks & Best Sellers
                </h2>
                <p class="text-xs text-slate-400">Most sought-after models in the community</p>
              </div>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
              ${bestSellers.map(ProductCard).join('')}
            </div>
          </section>

          <!-- COLLECTOR TRUST PROMO -->
          <section class="py-16 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="rounded-3xl glass p-8 sm:p-12 border border-slate-800 relative overflow-hidden">
              <div class="grid md:grid-cols-3 gap-8 text-center md:text-left">
                <div class="space-y-3">
                  <div class="w-12 h-12 rounded-2xl bg-rose-500/10 border border-rose-500/20 text-rose-400 flex items-center justify-center mx-auto md:mx-0">
                    <i data-lucide="shield-check" class="w-6 h-6"></i>
                  </div>
                  <h4 class="font-bold text-white text-base">100% Mint Card Guarantee</h4>
                  <p class="text-xs text-slate-400">Every car is inspected and shipped in protective blisters with cardboard reinforced packaging.</p>
                </div>

                <div class="space-y-3">
                  <div class="w-12 h-12 rounded-2xl bg-amber-500/10 border border-amber-500/20 text-amber-400 flex items-center justify-center mx-auto md:mx-0">
                    <i data-lucide="truck" class="w-6 h-6"></i>
                  </div>
                  <h4 class="font-bold text-white text-base">Insured Express Shipping</h4>
                  <p class="text-xs text-slate-400">Fast pan-India delivery with real-time tracking for collector confidence.</p>
                </div>

                <div class="space-y-3">
                  <div class="w-12 h-12 rounded-2xl bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 flex items-center justify-center mx-auto md:mx-0">
                    <i data-lucide="gem" class="w-6 h-6"></i>
                  </div>
                  <h4 class="font-bold text-white text-base">Rare Super Treasure Hunts</h4>
                  <p class="text-xs text-slate-400">Authentic Super Treasure Hunts and limited chase editions sourced directly.</p>
                </div>
              </div>
            </div>
          </section>

        </div>
      `;
    }

    // EXPLORE / SHOP VIEW (Full 50+ Cars Catalog)
    function ShopView() {
      let filtered = [...store.products];

      // Filter by Category
      if (store.activeCategoryFilter !== 'all') {
        const catObj = store.categories.find(c => c.slug === store.activeCategoryFilter);
        if (catObj) {
          filtered = filtered.filter(p => p.category_id === catObj.id);
        }
      }

      // Filter by Search
      if (store.searchQuery.trim() !== '') {
        const q = store.searchQuery.toLowerCase();
        filtered = filtered.filter(p => 
          p.name.toLowerCase().includes(q) || 
          p.series.toLowerCase().includes(q) ||
          p.manufacturer.toLowerCase().includes(q) ||
          p.car_model?.toLowerCase().includes(q)
        );
      }

      // Sort
      if (store.sortBy === 'price-low') filtered.sort((a, b) => a.price - b.price);
      else if (store.sortBy === 'price-high') filtered.sort((a, b) => b.price - a.price);
      else if (store.sortBy === 'rating') filtered.sort((a, b) => b.rating - a.rating);

      return `
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 flex-1">
          
          <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
            <div>

        <div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-10 flex-1">
          <h1 class="text-3xl font-black text-white mb-8">Collector Profile</h1>

          <div class="p-6 sm:p-8 rounded-3xl bg-slate-900/60 border border-slate-800 space-y-6">
            <div class="flex items-center gap-4">
              <img src="${store.user?.avatar_url || 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&q=80&w=200'}" class="w-16 h-16 rounded-2xl ring-4 ring-rose-500/30 object-cover" />
              <div>
                <h3 class="text-lg font-bold text-white">${store.user?.full_name}</h3>
                <p class="text-xs text-slate-400">${store.user?.email}</p>
                <span class="inline-block mt-1 px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-rose-500/10 text-rose-400 border border-rose-500/20 uppercase">
                  ${store.user?.role || 'Customer'}
                </span>
              </div>
            </div>

            <div class="pt-4 border-t border-slate-800 space-y-3">
              <button onclick="store.currentView = 'orders'; store.save();" class="w-full p-3.5 rounded-xl bg-slate-950 hover:bg-slate-800 text-slate-200 text-xs font-bold text-left flex items-center justify-between">
                <span>View My Orders (${store.orders.length})</span>
                <i data-lucide="chevron-right" class="w-4 h-4 text-slate-500"></i>
              </button>

              <button 
                onclick="
                  store.user.role = store.user.role === 'admin' ? 'customer' : 'admin';
                  store.showToast('Role switched to ' + store.user.role);
                  store.save();
                " 
                class="w-full p-3.5 rounded-xl bg-amber-500/10 hover:bg-amber-500/20 text-amber-400 text-xs font-bold text-left flex items-center justify-between border border-amber-500/20"
              >
                <span>Toggle Admin Role Demo Mode</span>
                <i data-lucide="shield" class="w-4 h-4"></i>
              </button>
            </div>
          </div>
        </div>
      `;
    }

    // FOOTER COMPONENT
    function Footer() {
      return `
        <footer class="mt-auto bg-slate-950 border-t border-slate-800/80 py-12 text-slate-400 text-xs">
          <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 grid grid-cols-1 md:grid-cols-4 gap-8">
            <div class="space-y-3">
              <span class="text-lg font-black text-white tracking-wider">DIECAST<span class="text-rose-500">HUB</span></span>
              <p class="text-slate-500 leading-relaxed">India's premier online marketplace for Hot Wheels, Matchbox, and rare die-cast vehicle collectibles with 50+ models in stock.</p>
            </div>

            <div>
              <h4 class="font-bold text-white mb-3 uppercase tracking-wider">Quick Links</h4>
              <ul class="space-y-2">
                <li><button onclick="store.activeCategoryFilter = 'all'; store.currentView = 'shop'; store.save();" class="hover:text-rose-400">Explore 50+ Cars</button></li>
                <li><button onclick="store.currentView = 'wishlist'; store.save();" class="hover:text-rose-400">My Wishlist</button></li>
                <li><button onclick="store.currentView = 'orders'; store.save();" class="hover:text-rose-400">Track Order</button></li>
              </ul>
            </div>

            <div>
              <h4 class="font-bold text-white mb-3 uppercase tracking-wider">Top Collections</h4>
              <ul class="space-y-2">
                <li><button onclick="store.activeCategoryFilter = 'jdm-cars'; store.currentView = 'shop'; store.save();" class="hover:text-rose-400">JDM Legends</button></li>
                <li><button onclick="store.activeCategoryFilter = 'supercars'; store.currentView = 'shop'; store.save();" class="hover:text-rose-400">Supercars & Hypercars</button></li>
                <li><button onclick="store.activeCategoryFilter = 'limited-edition'; store.currentView = 'shop'; store.save();" class="hover:text-rose-400">Super Treasure Hunts</button></li>
                <li><button onclick="store.activeCategoryFilter = 'movie-tv-cars'; store.currentView = 'shop'; store.save();" class="hover:text-rose-400">Movie & TV Star Cars</button></li>
              </ul>
            </div>

            <div>
              <h4 class="font-bold text-white mb-3 uppercase tracking-wider">Customer Support</h4>
              <p>Email: support@diecasthub.com</p>
              <p>Collector Helpline: +91 98765 43210</p>
              <p class="mt-2 text-slate-500">All vehicle brand logos and names belong to their respective owners.</p>
            </div>
          </div>
        </footer>
      `;
    }

    // MAIN RENDER CONTROLLER
    function renderApp() {
      const appEl = document.getElementById('app');
      let mainContent = '';

      switch (store.currentView) {
        case 'home': mainContent = HomeView(); break;
        case 'shop': mainContent = ShopView(); break;
        case 'product-details': mainContent = ProductDetailsView(); break;
        case 'cart': mainContent = CartView(); break;
        case 'checkout': mainContent = CheckoutView(); break;
        case 'orders': mainContent = OrdersView(); break;
        case 'wishlist': mainContent = WishlistView(); break;
        case 'profile': mainContent = ProfileView(); break;
        case 'admin': mainContent = AdminDashboardView(); break;
        default: mainContent = HomeView();
      }

      appEl.innerHTML = `
        ${Header()}
        <main class="flex-1 flex flex-col">${mainContent}</main>
        ${Footer()}
        ${Toast()}
      `;

      if (window.lucide) window.lucide.createIcons();
    }

    window.renderApp = renderApp;
    document.addEventListener('DOMContentLoaded', () => renderApp());
  </script>
</body>
</html>
